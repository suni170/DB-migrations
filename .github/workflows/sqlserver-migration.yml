name: Deploy SQL Changes to On-Premises SQL Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install sqlcmd
      run: |
        # Download and install SQLCMD tools (part of SQL Server command-line tools)
        Invoke-WebRequest -Uri https://aka.ms/sqlcmd -OutFile sqlcmd.msi
        Start-Process msiexec.exe -ArgumentList '/i', 'sqlcmd.msi', '/quiet', '/norestart' -NoNewWindow -Wait
        Remove-Item -Force sqlcmd.msi

    - name: Deploy SQL Script
      env:
        SQL_SERVER: "tcp:localhost"            # SQL Server hostname or IP
        SQL_DATABASE: "flask_db"               # Database name
        SQL_USERNAME: "sa"                     # SQL username
        SQL_PASSWORD: "2207"                 # SQL password
      run: |
        echo "Deploying SQL changes to the on-premises SQL Server"
        echo "SQL Server: $SQL_SERVER"
        echo "SQL Database: $SQL_DATABASE"
        echo "SQL Username: $SQL_USERNAME"
        sqlcmd -S "$SQL_SERVER" -d "$SQL_DATABASE" -U "$SQL_USERNAME" -P "$SQL_PASSWORD" -i "./sql/customer_table.sql"
