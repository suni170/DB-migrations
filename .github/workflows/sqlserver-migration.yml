name: Deploy SQL Changes to On-Premises SQL Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: windows-latest


    steps:

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up SQLCMD
      uses: microsoft/setup-sqlcmd@v1

    - name: Deploy SQL Script
      env:
        SQL_SERVER: "tcp:localhost"        # SQL Server hostname or IP
        SQL_DATABASE: "flask_db"    # Database name
        SQL_USERNAME: "sa"    # SQL username
        SQL_PASSWORD: "2207"     # SQL password stored in GitHub secrets
      run: |
        echo "Deploying SQL changes to the on-premises SQL Server"
        sqlcmd -S $SQL_SERVER -d $SQL_DATABASE -U $SQL_USERNAME -P $SQL_PASSWORD -i "./sql\customer_table.sql"
